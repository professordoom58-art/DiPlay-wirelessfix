name: Build and Publish Release APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release DiPlay APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Public Source Tree
        run: python3 scripts/check_public_tree.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build DiPlay Mobile Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          APK_PATH=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          RELEASE_NAME="DiPlay-WirelessFix-v0.2.21-b${{ github.run_number }}.apk"
          cp "$APK_PATH" "$RELEASE_NAME"
          sha256sum "$RELEASE_NAME" > SHA256SUMS.txt
          echo "Built APK: $RELEASE_NAME"
          cat SHA256SUMS.txt

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-WirelessFix-b${{ github.run_number }}
          path: |
            DiPlay-WirelessFix-v0.2.21-b${{ github.run_number }}.apk
            SHA256SUMS.txt
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.21-b${{ github.run_number }}
          name: "DiPlay Wireless Fix v0.2.21 (Build ${{ github.run_number }})"
          body: |
            ### 🚗 DiPlay Wireless Fix — ESP32 iAP2 Bridge Edition
            **Build**: `${{ github.run_number }}` | **Commit**: `${{ github.sha }}`

            ---

            #### ⚡ Key Features:
            - **ESP32 iAP2 Hardware Bridge**: Integrated external ESP32 Bluetooth / iAP2 RFCOMM bridge for Android head units without native Bluetooth RFCOMM.
            - **USB Serial Driver**: Built-in support for CP2102 and CH340 USB chips at 921,600 baud.
            - **CarPlay Controller Patch**: Seamless hardware bridge negotiation and MAC address correlation with native Bluetooth fallback.
            - **HUD Navigation**: Live turn arrows, distance, and street names on instrument cluster displays.
            - **Hotspot & Wi-Fi Direct**: Automatic address discovery and low-latency audio streaming.

            ---

            #### 📲 Installation:
            1. Download the `.apk` from the **Assets** section below.
            2. Install the APK directly on your Android head unit.
            3. Connect your ESP32 board via USB (CP2102/CH340) or enable the vehicle's 5 GHz hotspot.
            4. Pair your iPhone and tap **Connect**.
          files: |
            DiPlay-WirelessFix-v0.2.21-b${{ github.run_number }}.apk
            SHA256SUMS.txt
